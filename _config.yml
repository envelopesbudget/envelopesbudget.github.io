title: "Envelopes: My Budget"
description: "Envelope budgeting for Android without an account - your data stays on your device"
url: "https://envelopesbudget.org"
lang: en

# Карту сайта строит плагин (поддерживается GitHub Pages, версия из
# pages.github.com/versions.json). Руками её вести нельзя: забудешь страницу -
# и поисковик о ней не узнает.
plugins:
  - jekyll-sitemap

# Тему jekyll-theme-minimal сняли: её layout не отдаёт <head>, то есть ни
# описания, ни canonical, ни превью при шеринге туда не вставить. Вместо неё -
# свой _layouts/default.html и assets/style.css.

exclude:
  - README.md

# Ссылка на карточку в Play и рубильник кнопки. Пока false — на всех витринах
# стоит «Скоро в Google Play»; в день выхода в production ставим true, и
# официальный бейдж появляется сразу на всех языках. Метка referrer видна в
# Play Console как источник установок.
play_url: "https://play.google.com/store/apps/details?id=com.personal.my_budget&referrer=utm_source%3Dsite"
play_live: false
